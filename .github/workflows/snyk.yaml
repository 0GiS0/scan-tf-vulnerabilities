name: Snyk Scan

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true
    inputs:
      working-directory:
        description: 'The directory to run Snyk in'
        type: string
        required: false
        default: '.'

jobs:
  snyk:
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Snyk CLI to check for security issues
        uses: snyk/actions/setup@86b1cee1b8e110a78d528b3e1328a80e218111d2
              
      # Runs Snyk Infrastructure as Code (IaC) analysis and uploads result to Snyk.
      - name: Snyk IaC test and report
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          snyk iac test --sarif || true
          # snyk iac test --sarif > snyk-iac.sarif || true          
          snyk iac test --sarif > snyk-iac.sarif

      # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: ${{ inputs.working-directory }}/snyk-iac.sarif
